apiVersion: v1
kind: ConfigMap
metadata:
  name: caretta-vm-scrapeconfig
  namespace: caretta
data:
  scrape.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: caretta
        kubernetes_sd_configs:
          - namespaces:
              own_namespace: true
            role: pod
        metrics_path: /metrics
        relabel_configs:
          - action: keep
            regex: caretta
            replacement: $1
            separator: ;
            source_labels:
              - __meta_kubernetes_pod_label_app
          - action: labelmap
            regex: __meta_kubrnetes_pod_label_(.+)
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: caretta_pod
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: caretta_node
        scrape_interval: 5s
